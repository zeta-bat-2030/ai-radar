name: fetch-cn-feeds
on:
  schedule: [{cron: '*/15 * * * *'}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_cn.py
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add data/cn.json; git commit -m "update cn feeds" || exit 0; git push
